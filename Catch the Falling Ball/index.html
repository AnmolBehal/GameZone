<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catch the Falling Ball</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-menu">
    <h1>Catch the Falling Ball</h1>
    <p>Press <strong>Space</strong> to Start</p>
  </div>

  <div id="game-container">
    <div id="basket"></div>
    <div id="score-board"> <span id="score">0</span></div>
    <div id="lives-board">
       <span id="lives"></span>
    </div>
  </div>

  <div id="game-over">
    <h1>Game Over</h1>
    <p>Your Score: <span id="final-score">0</span></p>
    <p>Press <strong>Space</strong> to Restart</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
